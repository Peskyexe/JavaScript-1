<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave 4 - Kalender</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <div class="main">
        <h1>Oppgave 4 - Kalender</h1>
        <div class="current-time-container">
            <span id="local-time">2:48 PM</span>
            <p id="current-date">Tuesday, January 6, 2026</p>
        </div>
        <div class="container">
            <ul class="header-days" style="grid-area: box-1">
                <li id="day-1-header">
                    <span>Sun</span>
                    <span>7</span>
                </li>
                <li id="day-2-header">
                    <span>Mon</span>
                    <span>8</span>
                </li>
                <li id="day-3-header">
                    <span>Tue</span>
                    <span>9</span>
                </li>
                <li id="day-4-header">
                    <span>Wed</span>
                    <span>10</span>
                </li>
                <li id="day-5-header">
                    <span>Thu</span>
                    <span>11</span>
                </li>
                <li id="day-6-header">
                    <span>Fri</span>
                    <span>12</span>
                </li>
                <li id="day-7-header">
                    <span>Sat</span>
                    <span>13</span>
                </li>
            </ul>
            <ul class="days" style="grid-area: box-2">
                <li id="day-1"></li>
                <li id="day-2"></li>
                <li id="day-3"></li>
                <li id="day-4"></li>
                <li id="day-5"></li>
                <li id="day-6"></li>
                <li id="day-7"></li>
            </ul>
            <ul class="times" style="grid-area: box-3">
                <li></li>
                <li>04:00</li>
                <li>08:00</li>
                <li>12:00</li>
                <li>16:00</li>
                <li>20:00</li>
            </ul>
        </div>
    </div>
</body>
</html>
