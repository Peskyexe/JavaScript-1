<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oppgave 4 - Kalender</title>
    <link rel="stylesheet" href="styles.css">
    <script src="index.js" defer></script>
</head>
<body>
    <header>
        <h1>Oppgave 4 - Kalender</h1>
    </header>
    <div class="container">
        <div class="calendar">
            <div class="day" onclick="addEvent('day-1')">
                <span>1</span>
                <ul id="day-1"></ul>
            </div>
            <div class="day" onclick="addEvent('day-2')">
                <span>2</span>
                <ul id="day-2"></ul>
            </div>
            <div class="day" onclick="addEvent('day-3')">
                <span>3</span>
                <ul id="day-3"></ul>
            </div>
            <div class="day" onclick="addEvent('day-4')">
                <span>4</span>
                <ul id="day-4"></ul>
            </div>
            <div class="day" onclick="addEvent('day-5')">
                <span>5</span>
                <ul id="day-5"></ul>
            </div>
            <div class="day" onclick="addEvent('day-6')">
                <span>6</span>
                <ul id="day-6"></ul>
            </div>
            <div class="day" onclick="addEvent('day-7')">
                <span>7</span>
                <ul id="day-7"></ul>
            </div>
        </div>
    </div>

</body>
</html>
